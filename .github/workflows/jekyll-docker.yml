name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@11

    - name: Create and Build Cordova Project
      run: |
        # Buat project Cordova baru
        cordova create MyApp com.example.myapp "My App"
        cd MyApp
        
        # Jika ada file www di repository, salin ke project
        if [ -d "../www" ]; then
          cp -r ../www/* www/ || true
        fi
        
        # Tambahkan platform Android
        cordova platform add android@12.0.0
        
        # Build APK
        cordova build android --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: MyApp/platforms/android/app/build/outputs/apk/**/*.apk
