name: Build Cordova Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Set up JDK 17 for Android SDK tools
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Use the GitHub Actions provided Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Cordova
      run: npm install -g cordova@11

    # Switch to JDK 8 for Cordova build
    - name: Set up JDK 8 for Cordova
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8

    - name: Add Android platform
      run: cordova platform add android@12.0.0

    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_8_X64
        cordova build android --debug --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          platforms/android/app/build/outputs/apk/debug/*.apk
          platforms/android/app/build/outputs/apk/release/*.apk
