name: Build Cordova Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8

    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@11

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Navigate to Cordova project and add Android platform
      run: |
        cd MyApp  # Navigate to your Cordova project directory
        cordova platform add android@12.0.0

    - name: Build APK
      run: |
        cd MyApp  # Navigate to your Cordova project directory
        cordova build android --debug --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          MyApp/platforms/android/app/build/outputs/apk/debug/*.apk
          MyApp/platforms/android/app/build/outputs/apk/release/*.apk
