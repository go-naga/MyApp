name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova and Gradle
      run: |
        npm install -g cordova@11
        # Install specific Gradle version
        wget https://services.gradle.org/distributions/gradle-8.3-bin.zip -P /tmp
        unzip -d /opt /tmp/gradle-8.3-bin.zip
        export PATH=$PATH:/opt/gradle-8.3/bin
        gradle --version

    - name: Create Cordova Project
      run: |
        # Create Cordova project
        cordova create MyApp com.example.cctvcordova "CCTV Cordova Offline"
        cd MyApp
        
        # Copy www files if they exist
        if [ -d "../www" ]; then
          cp -r ../www/* www/ || true
        else
          # Create a basic HTML file if no www content exists
          echo '<html><body><h1>CCTV Cordova App</h1></body></html>' > www/index.html
        fi
        
        # Create config.xml with your configuration
        echo '<?xml version="1.0" encoding="utf-8"?>' > config.xml
        echo '<widget id="com.example.cctvcordova" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">' >> config.xml
        echo '  <name>CCTV Cordova Offline</name>' >> config.xml
        echo '  <description>Offline CCTV App dengan TensorFlow.js & COCO-SSD</description>' >> config.xml
        echo '  <author email="you@example.com">Dev</author>' >> config.xml
        echo '  <content src="index.html" />' >> config.xml
        echo '  <access origin="*" />' >> config.xml
        echo '  <allow-navigation href="*" />' >> config.xml
        echo '  <platform name="android">' >> config.xml
        echo '    <preference name="android-minSdkVersion" value="23" />' >> config.xml
        echo '    <preference name="android-targetSdkVersion" value="33" />' >> config.xml
        echo '  </platform>' >> config.xml
        echo '</widget>' >> config.xml

    - name: Add Android Platform
      run: |
        cd MyApp
        cordova platform add android@12.0.0
        
        # Check platform was added
        cordova platform ls

    - name: Build Debug APK with Gradle
      run: |
        cd MyApp
        # Set Gradle version
        mkdir -p platforms/android/gradle/wrapper
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
        
        # Build directly with Gradle to have more control
        cd platforms/android
        chmod +x gradlew
        ./gradlew assembleDebug --info
        
        # Check if APK was built
        find . -name "*.apk"

    - name: Find and Upload APK
      run: |
        mkdir -p apk-files
        find MyApp -name "*.apk" -type f -exec cp {} apk-files/ \;
        echo "APK files found:"
        ls -la apk-files || echo "No APK files found"

    - name: Upload APK Files
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: apk-files
        if-no-files-found: warn
        
    - name: Upload Build Outputs
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: MyApp/platforms/android/app/build/outputs
        if-no-files-found: warn
