name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Node.js 16
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Install Cordova
      run: |
        npm install -g cordova@11
        cordova --version

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    - name: Create Cordova Project
      run: |
        # Create Cordova project
        cordova create MyApp com.example.cctvcordova "CCTV Cordova Offline"
        cd MyApp
        
        # Copy www files if they exist
        if [ -d "../www" ]; then
          cp -r ../www/* www/ || true
        else
          # Create a basic HTML file if no www content exists
          echo '<html><body><h1>CCTV Cordova App</h1></body></html>' > www/index.html
        fi
        
        # Create config.xml with your configuration
        cat > config.xml << 'EOL'
<?xml version="1.0" encoding="utf-8"?>
<widget id="com.example.cctvcordova" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
  <name>CCTV Cordova Offline</name>
  <description>Offline CCTV App dengan TensorFlow.js &amp; COCO-SSD</description>
  <author email="you@example.com">Dev</author>
  <content src="index.html" />
  <access origin="*" />
  <allow-navigation href="*" />
  <platform name="android">
    <preference name="android-minSdkVersion" value="23" />
    <preference name="android-targetSdkVersion" value="33" />
  </platform>
</widget>
EOL

    - name: Check Cordova Requirements
      run: |
        cd MyApp
        cordova requirements

    - name: Add Android Platform
      run: |
        cd MyApp
        # Try multiple platform versions if needed
        echo "Trying Android platform 11.0.0..."
        cordova platform add android@11.0.0 --verbose || {
          echo "Failed with 11.0.0, trying 10.1.2..."
          cordova platform add android@10.1.2 --verbose || {
            echo "Failed with 10.1.2, trying latest version..."
            cordova platform add android --verbose || {
              echo "All platform add attempts failed. Debug info:"
              cordova requirements
              exit 1
            }
          }
        }
        
        # Verify platform was added
        cordova platform ls

    - name: Prepare Gradle Wrapper
      run: |
        cd MyApp
        if [ -d "platforms/android" ]; then
          cd platforms/android
          # Use Gradle to generate the wrapper with specific version
          gradle wrapper --gradle-version=7.6 --distribution-type=all
          chmod +x gradlew
        else
          echo "Android platform directory not found!"
          exit 1
        fi

    - name: Build Debug APK
      run: |
        cd MyApp
        # Build using Cordova first
        cordova build android --debug --verbose || {
          echo "Cordova build failed, trying direct Gradle build..."
          cd platforms/android
          ./gradlew assembleDebug --info
        }
        
        # Check if APK was built
        find . -name "*.apk"

    - name: Debug Info (on failure)
      if: failure()
      run: |
        java -version
        cordova --version
        ls -la MyApp || echo "MyApp directory not found"
        ls -la MyApp/platforms || echo "platforms directory not found"
        ls -la MyApp/platforms/android || echo "android platform directory not found"
        cat MyApp/config.xml || echo "config.xml not found"

    - name: Find and Upload APK
      run: |
        mkdir -p apk-files
        find MyApp -name "*.apk" -type f -exec cp {} apk-files/ \;
        echo "APK files found:"
        ls -la apk-files || echo "No APK files found"

    - name: Upload APK Files
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: apk-files
        if-no-files-found: warn
        
    - name: Upload Build Outputs
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: MyApp/platforms/android/app/build/outputs
        if-no-files-found: warn
