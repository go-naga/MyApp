name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'  # Using Node.js 18 for better compatibility

    - name: Install Cordova
      run: npm install -g cordova@11.0.0  # Specify exact version

    - name: Create and Build Cordova Project
      run: |
        # Create project directory
        mkdir -p MyApp
        cd MyApp
        
        # Initialize npm and install cordova locally
        npm init -y
        npm install cordova@11.0.0 --save-dev
        
        # Create basic www structure
        mkdir -p www
        echo '<html><body><h1>CCTV Cordova Offline</h1></body></html>' > www/index.html
        
        # Create config.xml manually
        cat > config.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<widget id="com.example.cctvcordova" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
  <name>CCTV Cordova Offline</name>
  <description>Offline CCTV App dengan TensorFlow.js &amp; COCO-SSD</description>
  <author email="you@example.com">Dev</author>
  <content src="index.html" />
  <access origin="*" />
  <allow-navigation href="*" />
  <platform name="android">
    <preference name="android-minSdkVersion" value="23" />
    <preference name="android-targetSdkVersion" value="33" />
  </platform>
</widget>
EOF
        
        # Copy www files from repository if they exist
        if [ -d "../www" ]; then
          cp -r ../www/* www/ || true
        fi
        
        # Add Android platform using local cordova
        npx cordova platform add android@12.0.0
        
        # Create gradle.properties to force Gradle version
        mkdir -p platforms/android/gradle/wrapper
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
        
        # Build APK
        npx cordova build android --verbose
        
    - name: Find and Upload APK
  run: |
    cd MyApp
    find platforms -name "*.apk" -type f
    mkdir -p apk-output
    find platforms -name "*.apk" -type f -exec cp {} apk-output/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: MyApp/platforms/android/app/build/outputs/apk/**/*.apk
