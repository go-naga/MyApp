name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@11

    - name: Create and Build Cordova Project
      run: |
        # Create Cordova project
        cordova create MyApp com.example.myapp "My App"
        cd MyApp
        
        # Copy www files if they exist
        if [ -d "../www" ]; then
          cp -r ../www/* www/ || true
        fi
        
        # Create config.xml with minimum Android 6 (API level 23)
        cat > config.xml << EOF
<?xml version='1.0' encoding='utf-8'?>
<widget id="com.example.myapp" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
    <name>My App</name>
    <description>Sample Apache Cordova App</description>
    <author email="dev@cordova.apache.org" href="https://cordova.apache.org">
        Apache Cordova Team
    </author>
    <content src="index.html" />
    <allow-intent href="http://*/*" />
    <allow-intent href="https://*/*" />
    <platform name="android">
        <preference name="android-minSdkVersion" value="23" />
        <preference name="android-targetSdkVersion" value="33" />
    </platform>
</widget>
EOF
        
        # Add Android platform
        cordova platform add android@12.0.0
        
        # Create gradle.properties to force Gradle version
        mkdir -p platforms/android/gradle/wrapper
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
        
        # Build APK
        cordova build android --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: MyApp/platforms/android/app/build/outputs/apk/**/*.apk
