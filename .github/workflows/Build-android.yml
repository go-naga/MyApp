name: Build Cordova Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Install Node.js and Cordova
      run: |
        npm install -g cordova@10.0.0  # Try an older Cordova version
        cordova --version
        
    - name: Install Node.js 16
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Install Cordova
      run: |
        npm install -g cordova@11
        cordova --version

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    - name: Build Debug APK with direct Gradle command
      run: |
       cd MyApp/platforms/android
       ./gradlew assembleDebug --info

    - name: Install Specific Gradle Version
      run: |
        wget https://services.gradle.org/distributions/gradle-7.6-bin.zip -P /tmp
        unzip -d /opt /tmp/gradle-7.6-bin.zip
        export PATH=/opt/gradle-7.6/bin:$PATH
        echo "PATH=/opt/gradle-7.6/bin:$PATH" >> $GITHUB_ENV
        gradle --version

    - name: Create Cordova Project
      run: |
        # Create Cordova project
        cordova create MyApp com.example.cctvcordova "CCTV Cordova Offline"
        cd MyApp
        
        # Create a basic HTML file
        echo '<html><body><h1>CCTV Cordova App</h1></body></html>' > www/index.html
        
        # Create config.xml with your configuration
        echo '<?xml version="1.0" encoding="utf-8"?>' > config.xml
        echo '<widget id="com.example.cctvcordova" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">' >> config.xml
        echo '  <name>CCTV Cordova Offline</name>' >> config.xml
        echo '  <description>Offline CCTV App dengan TensorFlow.js and COCO-SSD</description>' >> config.xml
        echo '  <author email="you@example.com">Dev</author>' >> config.xml
        echo '  <content src="index.html" />' >> config.xml
        echo '  <access origin="*" />' >> config.xml
        echo '  <allow-navigation href="*" />' >> config.xml
        echo '  <preference name="GradleVersion" value="7.6" />' >> config.xml
        echo '  <platform name="android">' >> config.xml
        echo '    <preference name="android-minSdkVersion" value="23" />' >> config.xml
        echo '    <preference name="android-targetSdkVersion" value="33" />' >> config.xml
        echo '  </platform>' >> config.xml
        echo '</widget>' >> config.xml
        
        # Show the created config.xml for debugging
        cat config.xml

    - name: Debug Environment
      run: |
        echo "Java version:"
        java -version
        echo "Cordova version:"
        cordova --version
        echo "Gradle version:"
        gradle --version
        echo "Android SDK info:"
        sdkmanager --list | grep -E "platform-tools|platforms;android-33|build-tools;33.0.0"
        echo "Node version:"
        node --version
        echo "NPM version:"
        npm --version

    - name: Debug Platform Installation
    run: |
       cd MyApp
       echo "Current directory structure:"
       ls -la
       echo "Platforms directory (if exists):"
       ls -la platforms || echo "Platforms directory doesn't exist"
       echo "Checking Cordova requirements:"
       cordova requirements --verbose

        # First check requirements
        cordova requirements || true
        
        # Try with a specific compatible version
        echo "Trying Android platform 10.1.2..."
        cordova platform add android@10.1.2 --verbose
        
        # Verify platform was added
        cordova platform ls
        
    - name: Configure Gradle Version for Cordova
      run: |
        cd MyApp
        if [ -d "platforms/android" ]; then
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          cat platforms/android/gradle/wrapper/gradle-wrapper.properties
        else
          echo "Android platform directory not found!"
          ls -la
          exit 1
        fi

    - name: Add Android Platform
      run: |
        cd MyApp
        # Create platforms directory if it doesn't exist
        mkdir -p platforms
        
        # Try with a specific compatible version with detailed error output
        echo "Trying Android platform 10.1.2..."
        cordova platform add android@10.1.2 --verbose --fetch || {
          echo "Failed with 10.1.2, trying 9.1.0..."
          cordova platform add android@9.1.0 --verbose --fetch || {
          echo "Failed with 9.1.0, trying latest version..."
          cordova platform add android --verbose --fetch || {
            echo "All platform add attempts failed. Debug info:"
            npm list -g cordova
            cordova --version
            java -version
          exit 1
            }
           }
         }
         
         # Verify platform was added
         ls -la platforms/
         cordova platform ls

    - name: Build Debug APK
      run: |
        cd MyApp
        cordova build android --debug --verbose --stacktrace
        
        # If that fails, try direct Gradle build
        if [ $?-ne0 ]; then
          echo "Cordova build failed, trying direct Gradle build..."
          cd platforms/android
          ./gradlew assembleDebug --info --stacktrace
        fi
        
        # Check if APK was built
        find . -name "*.apk"
      
    - name: Find and Upload APK
      run: |
        mkdir -p apk-files
        find MyApp -name "*.apk" -type f -exec cp {} apk-files/ \;
        echo "APK files found:"
        ls -la apk-files || echo "No APK files found"

    - name: Upload APK Files
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: apk-files
        if-no-files-found: warn
