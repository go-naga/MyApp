name: Build Cordova Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # First set up JDK 17 for Android SDK setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Setup Android SDK with JDK 17
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: latest
        packages: platform-tools platforms;android-33 build-tools;33.0.2

    - name: Install Cordova
      run: npm install -g cordova@11

    # Now switch to JDK 8 for Cordova operations
    - name: Set up JDK 8 for Cordova
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8

    # Check if we're in the right directory
    - name: Check directory structure
      run: |
        ls -la
        # If MyApp is a subdirectory, uncomment the next line
        # cd MyApp && ls -la

    - name: Add Android platform
      run: |
        # If MyApp is a subdirectory, uncomment the next line
        # cd MyApp
        cordova platform add android@12.0.0

    - name: Build APK
      run: |
        # If MyApp is a subdirectory, uncomment the next line
        # cd MyApp
        cordova build android --debug --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          platforms/android/app/build/outputs/apk/debug/*.apk
          platforms/android/app/build/outputs/apk/release/*.apk
          # If MyApp is a subdirectory, uncomment the next lines
          # MyApp/platforms/android/app/build/outputs/apk/debug/*.apk
          # MyApp/platforms/android/app/build/outputs/apk/release/*.apk
